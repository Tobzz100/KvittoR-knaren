<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kvittoräknaren - jämför AI-versioner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>Kvittoräknaren</h1>
    <p class="subtitle">Jämför hur olika AI-verktyg löste samma övning.</p>

    <section class="panel">
      <label for="version-select">Version</label>
      <select id="version-select"></select>
      <p id="quirk-blurb" class="quirk"></p>
    </section>

    <section class="panel">
      <form id="calc-form">
        <div id="inventory-field" class="field">
          <label>Varor</label>
          <div id="inventory-buttons" class="inventory"></div>
          <p class="help">Klicka på en vara för att lägga den i varukorgen. Priserna är exkl. moms.</p>

          <label>Varukorg</label>
          <ul id="cart"></ul>
        </div>

        <div id="list-field" class="field">
          <label for="shopping-list">Varulista</label>
          <textarea id="shopping-list" rows="3" placeholder=""></textarea>
          <p id="list-help" class="help"></p>
        </div>

        <div id="moms-field" class="field">
          <label for="moms">Moms (%)</label>
          <input type="number" id="moms" value="25" step="0.1">
        </div>

        <div id="discount-field" class="field">
          <label for="discount-code">Rabattkod (valfritt)</label>
          <input type="text" id="discount-code" placeholder="RABATT10">
        </div>

        <div id="currency-field" class="field">
          <label id="currency-label" for="currency">Valuta</label>
          <select id="currency">
            <option value="SEK">SEK</option>
            <option value="EUR">EUR</option>
            <option value="USD">USD</option>
          </select>
        </div>

        <button type="submit">Beräkna</button>
      </form>
      <div id="result"></div>
      <pre id="receipt" class="hidden"></pre>
    </section>

    <section class="panel">
      <button id="run-tests" type="button">Kör tester (hela sviten, alla versioner)</button>
      <div id="test-status"></div>
      <pre id="test-output"></pre>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
